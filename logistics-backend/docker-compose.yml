services:

  postgres:
    image: postgres:17
    container_name: logistics-postgres

    environment:
      POSTGRES_DB: logistics_db
      POSTGRES_USER: monika
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: logistics-redis

    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: logistics-backend

    ports:
      - "8080:8080"

    depends_on:
      - postgres
      - redis

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/logistics_db
      SPRING_DATASOURCE_USERNAME: monika
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

  frontend:
    build: ../frontend
    container_name: frontend

    ports:
      - "80:80"

    depends_on:
      - backend

volumes:
  postgres_data:
